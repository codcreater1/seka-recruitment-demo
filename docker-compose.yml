# Local run:  docker compose up --build   ->  http://localhost:3000
services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      INGEST_API_KEY: ${INGEST_API_KEY:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      RETENTION_MONTHS: ${RETENTION_MONTHS:-6}
      POOL_RETENTION_MONTHS: ${POOL_RETENTION_MONTHS:-24}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - recruitment-data:/data
    restart: unless-stopped

volumes:
  recruitment-data:
